<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المعلم الذكي</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --primary: #0EA5E9;
      --text: #0F172A;
      --muted: #64748B;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: fit-content;
    }
    h1 { font-size: 1.3rem; margin: 0; text-align: center; }
    p.subtitle { font-size: 0.9rem; color: var(--muted); margin: 0; text-align: center; }
    .upload-box {
      border: 2px dashed #CBD5E1;
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      background: #F1F5F9;
    }
    #preview {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: 12px;
      display: none;
    }
    button.action-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.action-btn:disabled { background: #94A3B8; cursor: not-allowed; }
    .response-card {
      display: none;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 16px;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .voice-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #E2E8F0;
    }
    .speaker-btn {
      background: #EEF2F6;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .interaction-group {
      display: none;
      gap: 10px;
    }
    .btn-feedback {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-understood { background: #DCFCE7; color: #166534; border: 1px solid #BBF7D0; }
    .btn-not-understood { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
  </style>
</head>
<body>

  <div class="container">
    <h1>المعلم الرقمي 💡</h1>
    <p class="subtitle">صوّر المسألة وسأساعدك في التفكير بخطوتها الأولى</p>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <span id="uploadText">📷 اضغط هنا لتصوير السؤال</span>
      <img id="preview" alt="معاينة السؤال">
      <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
    </div>

    <button id="sendBtn" class="action-btn" disabled>تحليل وتوجيه 🚀</button>

    <div id="responseCard" class="response-card">
      <div id="responseText"></div>
      <div class="voice-control">
        <span style="font-size: 0.8rem; color: var(--muted);">توجيه مسموع</span>
        <button id="speakBtn" class="speaker-btn">🔊 استمع مجدداً</button>
      </div>
    </div>

    <div id="interactionGroup" class="interaction-group">
      <button id="btnNotUnderstood" class="btn-feedback btn-not-understood">لم أفهم 🤔</button>
      <button id="btnUnderstood" class="btn-feedback btn-understood">فهمت 👍</button>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const uploadText = document.getElementById('uploadText');
    const sendBtn = document.getElementById('sendBtn');
    const responseCard = document.getElementById('responseCard');
    const responseText = document.getElementById('responseText');
    const speakBtn = document.getElementById('speakBtn');
    const interactionGroup = document.getElementById('interactionGroup');
    const btnUnderstood = document.getElementById('btnUnderstood');
    const btnNotUnderstood = document.getElementById('btnNotUnderstood');
    const audioPlayer = document.getElementById('audioPlayer');

    let currentSessionId = "";
    let compressedBlob = null;
    let currentAudioSrc = null;

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;

      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      uploadText.style.display = 'none';

      compressedBlob = await compressImage(file, 900, 0.7);
      sendBtn.disabled = false;
      interactionGroup.style.display = 'none';
    };

    function compressImage(file, maxWidth, quality) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = (maxWidth / width) * height;
            width = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
        };
      });
    }

    function playAudioBase64(base64Data) {
      if (!base64Data) return;
      currentAudioSrc = "data:audio/mp3;base64," + base64Data;
      audioPlayer.src = currentAudioSrc;
      audioPlayer.play();
    }

    sendBtn.onclick = async () => {
      if (!compressedBlob) return;

      sendBtn.disabled = true;
      sendBtn.innerText = "جاري قراءة المسألة والتفكير...";
      responseCard.style.display = 'none';
      interactionGroup.style.display = 'none';

      const formData = new FormData();
      formData.append("file", compressedBlob, "question.jpg");

      try {
        const res = await fetch("/analyze", { method: "POST", body: formData });
        const data = await res.json();
        
        currentSessionId = data.session_id;
        responseText.innerText = data.guidance;
        responseCard.style.display = 'block';
        interactionGroup.style.display = 'flex';

        playAudioBase64(data.audio);
      } catch (err) {
        alert("حدث ضغط مؤقت في الاتصال، يرجى إعادة المحاولة.");
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "تحليل وتوجيه 🚀";
      }
    };

    async function sendFeedback(actionType) {
      btnUnderstood.disabled = true;
      btnNotUnderstood.disabled = true;
      responseText.innerText = "جاري التفكير في طريقة أبسط...";

      try {
        const res = await fetch("/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: currentSessionId, action: actionType })
        });
        const data = await res.json();
        responseText.innerText = data.guidance;
        playAudioBase64(data.audio);
      } catch (err) {
        alert("تعذر الاتصال.");
      } finally {
        btnUnderstood.disabled = false;
        btnNotUnderstood.disabled = false;
      }
    }

    btnUnderstood.onclick = () => sendFeedback("understood");
    btnNotUnderstood.onclick = () => sendFeedback("not_understood");
    speakBtn.onclick = () => {
      if (currentAudioSrc) audioPlayer.play();
    };
  </script>
</body>
</html>
